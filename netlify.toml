# 빌드 과정이 없는 정적 사이트입니다. public 폴더를 그대로 배포합니다.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"

# 주소 끝 .html 없애기: /about.html 로 들어와도 /about 으로 (예전 링크·검색 결과를 한 주소로 모음)
#  · 파일(about.html)이 실제로 있어서 force = true 가 있어야 동작합니다.
#  · /work.html?id=… 처럼 뒤에 붙은 값은 Netlify 가 그대로 넘겨 줍니다.
#  · /about 은 Netlify 가 about.html 을 찾아 보여 줍니다(따로 설정 필요 없음).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/process.html"
  to = "/process"
  status = 301
  force = true

[[redirects]]
  from = "/reviews.html"
  to = "/reviews"
  status = 301
  force = true

[[redirects]]
  from = "/works.html"
  to = "/works"
  status = 301
  force = true

[[redirects]]
  from = "/work.html"
  to = "/work"
  status = 301
  force = true


# 관리화면은 검색엔진에 노출하지 않고, 항상 최신 파일을 받도록
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# 모든 화면 공통 보안 설정
#  · Content-Security-Policy: 이 홈페이지·Supabase·글꼴(Pretendard) 외의 곳에서 온 스크립트·연결을 브라우저가 막습니다.
#    누군가 상담 신청서 메모 칸 등에 해킹 코드를 넣어도 관리화면에서 실행되지 않도록 하는 두 번째 안전장치입니다.
#  · frame-ancestors / X-Frame-Options: 다른 사이트가 이 홈페이지(특히 관리화면)를 몰래 액자처럼 띄워 클릭을 가로채지 못하게 합니다.
#  ★ 외부 서비스(지도 넣기, 방문 통계 등)를 새로 붙이면 아래 Content-Security-Policy 에 그 주소를 추가해야 동작합니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/pretendard@1.3.9/; font-src 'self' https://cdn.jsdelivr.net/npm/pretendard@1.3.9/; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
