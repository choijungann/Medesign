<div class="layout" id="layout">
<aside class="side" id="side" aria-label="관리 메뉴" hidden></aside>
<div class="side-backdrop" id="side-backdrop" hidden></div>
<div class="main-col">
<div id="demo-note" class="demo-note" hidden>데모 화면입니다 · 여기서 올린 내용은 <b>이 기기(브라우저)에만</b> 저장돼요</div>
<header class="topbar" id="topbar" hidden>
  <div class="topbar-in">
    <button class="icon-btn" id="back-btn" type="button" aria-label="뒤로" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="top-title">홈</h1>
    <!-- 오른쪽 위: 관리화면 첫 화면(대시보드)으로 — 홈페이지 보기는 메뉴 아래쪽에 (2026-10-26) -->
    <a class="icon-btn home-link" id="home-link" href="#/" aria-label="관리화면 첫 화면으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
      <span>홈</span>
    </a>
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-controls="side" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>메뉴</span>
    </button>
  </div>
</header>
<main class="shell" id="app">
  <div class="loading">불러오는 중…</div>
</main>
